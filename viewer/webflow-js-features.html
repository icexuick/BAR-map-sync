<script>
// Plain (non-module) script on purpose. Firefox / iOS Safari don't deal well
// with two separate <script type="module"> blocks both importing the same
// three.js URL — they end up with two distinct THREE namespaces and instanceof
// checks break. So instead we wait for the host footer script to expose its
// own THREE + GLTFLoader via window.barTerrain, and reuse those.
//
// All "top-level" code is wrapped in an IIFE so we don't leak helpers into
// window scope. THREE / GLTFLoader are filled in from the host inside init().
(function () {
let THREE, GLTFLoader;

// Mobile devices skip GLB feature loading entirely. Geovents (smoke) still
// spawn — they're cheap and visually important — but the heavy 3D models
// (trees, rocks, statues, etc.) are too expensive on phones, both in
// download size and per-frame render cost. Same UA detection as the host
// footer so behavior is consistent.
const IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800;

// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------

const GH_OWNER = 'icexuick';
const GH_REPO = 'BAR-map-sync';
const GH_BRANCH = 'main';
const CDN_BASE = `https://cdn.jsdelivr.net/gh/${GH_OWNER}/${GH_REPO}@${GH_BRANCH}`;

// Spring world is measured in "elmos". The main script builds the terrain
// plane with size `mapW * 128 × mapH * 128` Three world units, where mapW/mapH
// come from data-map-width / data-map-height in "map-squares". One
// map-square = 512 elmos, so the horizontal conversion is a constant:
//
//     threeUnitsPerElmo = (mapW * 128) / (mapW * 512) = 128 / 512 = 0.25
//
// Features are authored in elmos, so every model needs scale = 0.25 in XZ.
const THREE_UNITS_PER_ELMO = 128 / 512; // 0.25

// Any feature whose name matches is treated as a geovent (invisible geyser
// marker) and gets a smoke plume instead of a GLB.
const GEOVENT_NAMES = new Set([
  'geovent',
  'geothermal',
  'geovent_feature',
]);

// Smoke sprite — you picked this one in Webflow assets
const SMOKE_SPRITE_URL =
  'https://cdn.prod.website-files.com/5c68622246b367adf6f3041d/69cbda83c9b8dff28c72325a_dirtbar.png';

// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------

function log(...args) {
  console.log('[bar-features]', ...args);
}
function warn(...args) {
  console.warn('[bar-features]', ...args);
}

/**
 * Wait for the host terrain script to dispatch `barMapReady`. Resolves with
 * the host context object (scene, camera, CONFIG, scaledW, scaledH, ...).
 */
function waitForHost() {
  return new Promise((resolve) => {
    if (window.barTerrain) {
      resolve(window.barTerrain);
      return;
    }
    const handler = (e) => {
      document.removeEventListener('barMapReady', handler, true);
      resolve(e.detail || window.barTerrain);
    };
    // Capture phase on document so we catch the event regardless of which
    // element dispatched it.
    document.addEventListener('barMapReady', handler, true);
  });
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  return r.json();
}

// ---------------------------------------------------------------------------
// Coordinate conversion
// ---------------------------------------------------------------------------

/**
 * Bilinear sample of the host's shared heightmap at Spring world (x, z).
 * Returns the real-world Y in elmos. The host (footer) decoded the PNG once
 * with the CMS min/max so we don't have to know either of those here — the
 * Float32Array already contains absolute heights.
 */
function sampleHeightmapAtSpring(hm, springX, springZ, worldW, worldH) {
  let gx = (springX / worldW) * (hm.width - 1);
  let gz = (springZ / worldH) * (hm.height - 1);
  if (gx < 0) gx = 0; else if (gx > hm.width - 1.0001) gx = hm.width - 1.0001;
  if (gz < 0) gz = 0; else if (gz > hm.height - 1.0001) gz = hm.height - 1.0001;
  const x0 = gx | 0, z0 = gz | 0;
  const fx = gx - x0, fz = gz - z0;
  const i00 = z0 * hm.width + x0;
  const i10 = i00 + 1;
  const i01 = i00 + hm.width;
  const i11 = i01 + 1;
  return (1 - fx) * (1 - fz) * hm.heights[i00]
       +      fx  * (1 - fz) * hm.heights[i10]
       + (1 - fx) *      fz  * hm.heights[i01]
       +      fx  *      fz  * hm.heights[i11];
}

/**
 * Convert a Spring (x, y, z) in elmos into a Three world-space position
 * relative to the terrain mesh. The terrain is centered at origin and
 * spans [-scaledW/2 .. +scaledW/2] × [-scaledH/2 .. +scaledH/2].
 *
 * Vertical: if the host shared a decoded heightmap (which is the normal
 * case in production), we sample it at the feature's (x, z) and ignore
 * `py`. The shared heightmap is the single source of truth for terrain
 * height — same PNG, same CMS min/max as the terrain mesh, so features
 * land exactly on the ground.
 *
 * Fallback: if the host didn't expose a heightmap (older footer / local
 * viewer), use the `py` value baked into placements.json by the Python
 * extractor. Same multiplier as the terrain so it lines up there too.
 */
function springToThree(px, pz, py, ctx) {
  const { scaledW, scaledH, CONFIG, heightmap, worldW, worldH } = ctx;
  const worldX = px * THREE_UNITS_PER_ELMO - scaledW / 2;
  const worldZ = pz * THREE_UNITS_PER_ELMO - scaledH / 2;
  let elmoY;
  if (heightmap && worldW && worldH) {
    elmoY = sampleHeightmapAtSpring(heightmap, px, pz, worldW, worldH);
  } else {
    elmoY = py;
  }
  const worldY = elmoY * CONFIG.globalHeightMultiplier;
  return { worldX, worldY, worldZ };
}

// ---------------------------------------------------------------------------
// Feature loading + placement
// ---------------------------------------------------------------------------

/**
 * Two-phase loader: downloads all GLB files in parallel via fetch()
 * (network I/O doesn't block the main thread), then parses + places
 * them one at a time with frame yields so the render loop stays smooth.
 *
 * Phase 1 — download: fire off all fetches at once (HTTP/2 muxes them
 * over a single TCP connection). Each resolves to an ArrayBuffer.
 * The browser's HTTP cache handles repeat visits automatically.
 *
 * Phase 2 — parse & place: feed each ArrayBuffer into GLTFLoader.parse()
 * one by one, with a requestAnimationFrame yield between each so the
 * terrain keeps rendering smoothly while features pop in.
 */
const _yieldFrame = () => new Promise(r => requestAnimationFrame(r));

async function downloadAllGLBs(uniqueNames) {
  const buffers = new Map(); // name → ArrayBuffer
  const failed = [];
  const results = await Promise.allSettled(
    uniqueNames.map(async (name) => {
      const url = `${CDN_BASE}/features/${name}/model.glb`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const buf = await r.arrayBuffer();
      buffers.set(name, buf);
    })
  );
  results.forEach((r, i) => {
    if (r.status === 'rejected') {
      warn(`download failed: ${uniqueNames[i]}`, r.reason?.message || r.reason);
      failed.push(uniqueNames[i]);
    }
  });
  log(`  downloaded ${buffers.size}/${uniqueNames.length} GLBs (${failed.length} failed)`);
  return { buffers, failed };
}

/**
 * Pull the first Mesh out of a loaded GLTF scene and prepare its material
 * for instancing. All BAR feature GLBs are single-mesh / single-material
 * (verified via inspection of the build pipeline output), so we can grab
 * `proto.children[0]` or recurse one level. Returns { geometry, material }.
 *
 * Material is mutated: shadows/anisotropy/envMapIntensity all configured
 * once on the prototype instead of per-instance — saves O(N) traversal.
 */
/**
 * Merge a list of { geometry, localMatrix } pieces into a single
 * BufferGeometry, baking each piece's local transform into its vertex
 * positions and normals. This is the core of the draw-call-overhead
 * optimization: 14 piece InstancedMeshes per crystal becomes 1 (or N
 * where N = number of unique materials within the GLB), which collapses
 * ~624 draws/frame on flats-and-forests to ~80-150.
 *
 * Implementation notes:
 * - All s3o-derived GLBs share a consistent attribute set (POSITION,
 *   NORMAL, TEXCOORD_0, optionally TANGENT) so we don't need a generic
 *   merger; we hand-roll one that knows exactly these attributes.
 * - Position is transformed by the full localMatrix.
 * - Normal is transformed by the inverse-transpose 3×3 of localMatrix
 *   (== upper-3×3 if the matrix is rigid + uniform scale, which it is
 *   in our pipeline). Then re-normalized so non-uniform scale wouldn't
 *   bite us if it ever appears.
 * - Tangent (xyz, w handedness) gets the same upper-3×3 transform on
 *   the xyz part, w stays as-is.
 * - All input geometries must be indexed; the s3o → glTF builder always
 *   writes indices, so this is safe.
 */
function mergeAndBakePieces(pieces) {
  if (pieces.length === 1 && pieces[0].localMatrix.elements[12] === 0
      && pieces[0].localMatrix.elements[13] === 0
      && pieces[0].localMatrix.elements[14] === 0
      && pieces[0].localMatrix.elements[0] === 1
      && pieces[0].localMatrix.elements[5] === 1
      && pieces[0].localMatrix.elements[10] === 1) {
    // Single piece, identity-ish transform: skip the bake and reuse the
    // original geometry verbatim. Saves a buffer copy for the common
    // single-mesh feature case (most rocks, simple trees).
    return pieces[0].geometry;
  }

  // Pre-compute totals so we can allocate exact-size typed arrays.
  let totalVerts = 0;
  let totalIndices = 0;
  let hasTangent = true;
  for (const { geometry } of pieces) {
    const posAttr = geometry.getAttribute('position');
    if (!posAttr) continue;
    totalVerts += posAttr.count;
    const idx = geometry.getIndex();
    totalIndices += idx ? idx.count : posAttr.count;
    if (!geometry.getAttribute('tangent')) hasTangent = false;
  }

  const positions = new Float32Array(totalVerts * 3);
  const normals = new Float32Array(totalVerts * 3);
  const uvs = new Float32Array(totalVerts * 2);
  const tangents = hasTangent ? new Float32Array(totalVerts * 4) : null;
  // Index width: pick uint32 if any piece pushes us past 65535 verts.
  const indices = totalVerts > 65535
    ? new Uint32Array(totalIndices)
    : new Uint16Array(totalIndices);

  let vCursor = 0; // running vertex offset across pieces
  let iCursor = 0; // running index offset across pieces
  const tmpV = new THREE.Vector3();
  const tmpN = new THREE.Vector3();
  const normalMat = new THREE.Matrix3();

  for (const { geometry, localMatrix } of pieces) {
    const posAttr = geometry.getAttribute('position');
    const normAttr = geometry.getAttribute('normal');
    const uvAttr = geometry.getAttribute('uv');
    const tanAttr = hasTangent ? geometry.getAttribute('tangent') : null;
    const idx = geometry.getIndex();
    if (!posAttr) continue;

    normalMat.getNormalMatrix(localMatrix);
    const vCount = posAttr.count;

    for (let i = 0; i < vCount; i++) {
      tmpV.fromBufferAttribute(posAttr, i).applyMatrix4(localMatrix);
      positions[(vCursor + i) * 3    ] = tmpV.x;
      positions[(vCursor + i) * 3 + 1] = tmpV.y;
      positions[(vCursor + i) * 3 + 2] = tmpV.z;

      if (normAttr) {
        tmpN.fromBufferAttribute(normAttr, i).applyMatrix3(normalMat).normalize();
      } else {
        tmpN.set(0, 1, 0);
      }
      normals[(vCursor + i) * 3    ] = tmpN.x;
      normals[(vCursor + i) * 3 + 1] = tmpN.y;
      normals[(vCursor + i) * 3 + 2] = tmpN.z;

      if (uvAttr) {
        uvs[(vCursor + i) * 2    ] = uvAttr.getX(i);
        uvs[(vCursor + i) * 2 + 1] = uvAttr.getY(i);
      }

      if (tanAttr) {
        tmpN.set(tanAttr.getX(i), tanAttr.getY(i), tanAttr.getZ(i))
            .applyMatrix3(normalMat).normalize();
        tangents[(vCursor + i) * 4    ] = tmpN.x;
        tangents[(vCursor + i) * 4 + 1] = tmpN.y;
        tangents[(vCursor + i) * 4 + 2] = tmpN.z;
        tangents[(vCursor + i) * 4 + 3] = tanAttr.getW(i);
      }
    }

    if (idx) {
      const idxArr = idx.array;
      for (let i = 0; i < idx.count; i++) {
        indices[iCursor + i] = idxArr[i] + vCursor;
      }
      iCursor += idx.count;
    } else {
      // Non-indexed: synthesize 0..N-1 indices with the vertex offset.
      for (let i = 0; i < vCount; i++) {
        indices[iCursor + i] = i + vCursor;
      }
      iCursor += vCount;
    }
    vCursor += vCount;
  }

  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  merged.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  if (tangents) merged.setAttribute('tangent', new THREE.BufferAttribute(tangents, 4));
  merged.setIndex(new THREE.BufferAttribute(indices, 1));
  return merged;
}

function prepareProto(protoScene, ctx) {
  // Make sure every node's matrixWorld reflects its glTF transform — the
  // s3o → glTF builder writes per-piece offsets onto node translations, so
  // a mesh that *looks* like it lives at origin in local space might
  // actually sit several elmos away once the parent transforms are baked.
  protoScene.updateMatrixWorld(true);

  // Walk the GLB scene and collect every mesh, grouped by material
  // identity. Pieces sharing the same material get merged into one
  // baked geometry; pieces with different materials stay separate (one
  // InstancedMesh per material group). For most BAR features all pieces
  // share a single material, so this collapses 4-16 piece InstancedMeshes
  // into a single one.
  const piecesByMaterial = new Map(); // material -> [{ geometry, localMatrix }]
  protoScene.traverse((o) => {
    if (!o.isMesh) return;
    const material = Array.isArray(o.material) ? o.material[0] : o.material;
    if (material) {
      if ('envMapIntensity' in material) material.envMapIntensity = ctx.CONFIG.envMapIntensity;
      const texProps = ['map','normalMap','aoMap','roughnessMap','metalnessMap','emissiveMap','alphaMap'];
      for (const tp of texProps) {
        const tex = material[tp];
        if (!tex) continue;
        if (IS_MOBILE) {
          tex.generateMipmaps = false;
          tex.minFilter = THREE.LinearFilter;
          tex.needsUpdate = true;
        } else {
          tex.anisotropy = 8;
        }
      }
    }
    const key = material || '__nomat__';
    let bucket = piecesByMaterial.get(key);
    if (!bucket) {
      bucket = [];
      piecesByMaterial.set(key, bucket);
    }
    bucket.push({
      geometry: o.geometry,
      // Bake the piece's full world matrix into the merged geometry —
      // without this we'd drop the per-piece translation / rotation /
      // scale the s3o builder put on the parent nodes.
      localMatrix: o.matrixWorld.clone(),
    });
  });
  if (piecesByMaterial.size === 0) return null;

  const groups = [];
  for (const [material, pieces] of piecesByMaterial) {
    const mergedGeometry = mergeAndBakePieces(pieces);
    groups.push({
      geometry: mergedGeometry,
      material: material === '__nomat__' ? null : material,
    });
  }
  return groups;
}

const FEATURE_SCALE = THREE_UNITS_PER_ELMO; // 0.25 — elmo → three world units

// THREE math scratch objects — lazily created on first use because `THREE`
// is filled in inside init() (we share the host's THREE namespace, so we
// can't `new THREE.Matrix4()` at IIFE evaluation time).
let _tmpMatrix, _tmpQuat, _tmpPos, _tmpScale, _yAxis;
function ensureScratch() {
  if (_tmpMatrix) return;
  _tmpMatrix = new THREE.Matrix4();
  _tmpQuat = new THREE.Quaternion();
  _tmpPos = new THREE.Vector3();
  _tmpScale = new THREE.Vector3(FEATURE_SCALE, FEATURE_SCALE, FEATURE_SCALE);
  _yAxis = new THREE.Vector3(0, 1, 0);
}

// ---------------------------------------------------------------------------
// Geovent smoke particles
// ---------------------------------------------------------------------------

// Custom Points shader: PointsMaterial doesn't support per-particle UV
// rotation, size scaling, or lifetime-driven fades, so we ship our own
// minimal one.
//   aSize     — per-particle size multiplier (~0.93..1.07), set on spawn
//   aRotation — per-particle UV rotation in radians, updated on CPU each
//               frame so each sprite slowly spins around its center.
//   aLife     — current 0..1 lifetime, used to grow the sprite (1× → 2.4×)
//               and fade it out after 50%.
//   aTint     — per-particle brightness multiplier (~0.9..1.1) so the
//               plume contains a mix of slightly lighter / darker puffs.
const SMOKE_VERT = `
  attribute float aSize;
  attribute float aRotation;
  attribute float aLife;
  attribute float aTint;
  varying float vCos;
  varying float vSin;
  varying float vLife;
  varying float vTint;
  uniform float uBaseSize;
  void main() {
    vCos = cos(aRotation);
    vSin = sin(aRotation);
    vLife = aLife;
    vTint = aTint;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    float growth = 1.0 + 1.4 * aLife;
    gl_PointSize = uBaseSize * aSize * growth * (300.0 / -mv.z);
  }
`;
const SMOKE_FRAG = `
  uniform sampler2D uMap;
  uniform vec3 uColor;
  uniform float uOpacity;
  varying float vCos;
  varying float vSin;
  varying float vLife;
  varying float vTint;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    uv = mat2(vCos, -vSin, vSin, vCos) * uv;
    uv += 0.5;
    vec4 tex = texture2D(uMap, uv);
    float fade = 1.0 - smoothstep(0.5, 1.0, vLife);
    vec3 tinted = clamp(uColor * vTint, 0.0, 1.0);
    gl_FragColor = vec4(tinted, tex.a * uOpacity * fade);
  }
`;

/**
 * One Points object for every geovent on the map. Each vent owns PER_VENT
 * particles; when a particle's phase hits 1.0 it respawns at its source.
 * Single draw call for the whole map regardless of vent count.
 */
function buildGeoventSmoke(geovents, ctx) {
  if (!geovents.length) return null;

  const PER_VENT = 60;
  const total = geovents.length * PER_VENT;

  // Precompute each geovent's world position
  const vents = geovents.map((p) => {
    const { worldX, worldY, worldZ } = springToThree(p.x, p.z, p.y, ctx);
    return new THREE.Vector3(worldX, worldY, worldZ);
  });

  const positions = new Float32Array(total * 3);
  const lifetimes = new Float32Array(total); // 0..1 phase
  const speeds = new Float32Array(total);
  const horizontal = new Float32Array(total * 2); // per-particle drift
  const ventIdx = new Int32Array(total);
  const sizes = new Float32Array(total);          // ±7% size variance
  const rotations = new Float32Array(total);      // current UV rotation, radians
  const rotRates = new Float32Array(total);       // ±5% of a full turn per second
  const tints = new Float32Array(total);          // ±10% brightness multiplier

  for (let i = 0; i < total; i++) {
    const vi = (i / PER_VENT) | 0;
    ventIdx[i] = vi;
    lifetimes[i] = Math.random();
    speeds[i] = 0.25 + Math.random() * 0.35;
    // Tiny lateral wobble — plume reads as a vertical line instead of a cone.
    horizontal[i * 2    ] = (Math.random() - 0.5) * 0.08;
    horizontal[i * 2 + 1] = (Math.random() - 0.5) * 0.08;
    sizes[i] = 1.0 + (Math.random() - 0.5) * 0.14;        // [0.93..1.07]
    rotations[i] = Math.random() * Math.PI * 2.0;         // 360° random spawn
    rotRates[i] = (Math.random() - 0.5) * 0.10 * Math.PI * 2.0; // ±5% of 2π/sec
    tints[i] = 0.8 + Math.random() * 0.7;                 // [0.8..1.5]
    const v = vents[vi];
    positions[i * 3    ] = v.x;
    positions[i * 3 + 1] = v.y;
    positions[i * 3 + 2] = v.z;
  }

  const lifeBuf = new Float32Array(total);
  for (let i = 0; i < total; i++) lifeBuf[i] = lifetimes[i];

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geom.setAttribute('aRotation', new THREE.BufferAttribute(rotations, 1));
  geom.setAttribute('aLife', new THREE.BufferAttribute(lifeBuf, 1));
  geom.setAttribute('aTint', new THREE.BufferAttribute(tints, 1));

  const tex = new THREE.TextureLoader().load(SMOKE_SPRITE_URL, (t) => {
    t.colorSpace = THREE.SRGBColorSpace;
  });
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipMapLinearFilter;

  // Terrain is ~1000 Three units across on a typical BAR map; uBaseSize
  // is the screen size at the start of a particle's life, and the
  // shader expands it to ~2.4× over the lifetime as the puff rises.
  // Per-particle aTint adds ±10% brightness wobble around uColor so the
  // plume contains a mix of slightly lighter / darker puffs.
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uMap:      { value: tex },
      uColor:    { value: new THREE.Color(0x8a8a8a) },
      uOpacity:  { value: 0.5 },
      uBaseSize: { value: 20.0 },
    },
    vertexShader: SMOKE_VERT,
    fragmentShader: SMOKE_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
  });

  const points = new THREE.Points(geom, mat);
  points.frustumCulled = false;
  points.name = 'bar-geovent-smoke';
  points.userData = {
    vents, lifetimes, speeds, horizontal, ventIdx, PER_VENT,
    sizes, rotations, rotRates, tints,
  };
  return points;
}

function tickSmoke(points, dt) {
  const {
    vents, lifetimes, speeds, horizontal, ventIdx,
    sizes, rotations, rotRates, tints,
  } = points.userData;
  const posAttr = points.geometry.attributes.position;
  const rotAttr = points.geometry.attributes.aRotation;
  const sizeAttr = points.geometry.attributes.aSize;
  const lifeAttr = points.geometry.attributes.aLife;
  const tintAttr = points.geometry.attributes.aTint;
  const arr = posAttr.array;

  const plumeHeight = 60;  // Three-units, roughly 240 elmos
  const fadeInSec = 3.0;

  for (let i = 0; i < lifetimes.length; i++) {
    // Subtle continuous rotation
    rotations[i] += rotRates[i] * dt;
    rotAttr.array[i] = rotations[i];

    lifetimes[i] += dt / fadeInSec * speeds[i];
    if (lifetimes[i] >= 1.0) {
      lifetimes[i] = 0.0;
      // Re-roll per-particle randomness each respawn so the column
      // doesn't settle into a recognisable pattern.
      sizes[i] = 1.0 + (Math.random() - 0.5) * 0.14;
      rotations[i] = Math.random() * Math.PI * 2.0;
      rotRates[i] = (Math.random() - 0.5) * 0.10 * Math.PI * 2.0;
      tints[i] = 0.8 + Math.random() * 0.7;
      sizeAttr.array[i] = sizes[i];
      rotAttr.array[i] = rotations[i];
      tintAttr.array[i] = tints[i];
      lifeAttr.array[i] = 0.0;
      const v = vents[ventIdx[i]];
      arr[i * 3    ] = v.x;
      arr[i * 3 + 1] = v.y;
      arr[i * 3 + 2] = v.z;
      continue;
    }
    const t = lifetimes[i];
    lifeAttr.array[i] = t;
    const v = vents[ventIdx[i]];
    arr[i * 3    ] = v.x + horizontal[i * 2    ] * plumeHeight * t;
    arr[i * 3 + 1] = v.y + plumeHeight * t;
    arr[i * 3 + 2] = v.z + horizontal[i * 2 + 1] * plumeHeight * t;
  }
  posAttr.needsUpdate = true;
  rotAttr.needsUpdate = true;
  sizeAttr.needsUpdate = true;
  tintAttr.needsUpdate = true;
  lifeAttr.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

async function init() {
  const host = await waitForHost();
  const { scene, container, CONFIG, scaledW, scaledH } = host;
  if (!scene || !CONFIG) {
    warn('host context missing scene/CONFIG — aborting');
    return;
  }
  // Pull THREE + GLTFLoader from the host so we share its module instance
  // (see comment at the top of this file). If the host script is older and
  // doesn't expose them, bail loudly rather than silently breaking.
  THREE = host.THREE;
  GLTFLoader = host.GLTFLoader;
  if (!THREE || !GLTFLoader) {
    warn('host did not expose THREE / GLTFLoader on window.barTerrain — aborting');
    return;
  }

  const slug = container?.dataset?.mapSlug
    || document.querySelector('[data-map-slug]')?.dataset?.mapSlug;
  if (!slug) {
    warn('no data-map-slug on #map-container — aborting');
    return;
  }
  log(`loading placements for "${slug}"`);

  const url = `${CDN_BASE}/maps_placement/${slug}/placements.json`;
  let sceneData;
  try {
    sceneData = await fetchJson(url);
  } catch (e) {
    warn(`failed to load ${url}: ${e.message || e}`);
    return;
  }
  log(`${sceneData.features.length} placements, world ${sceneData.worldWidth}×${sceneData.worldHeight} elmos`);

  // Sanity: host scaledW should match worldWidth * THREE_UNITS_PER_ELMO.
  const expectedThreeW = sceneData.worldWidth * THREE_UNITS_PER_ELMO;
  if (Math.abs(expectedThreeW - scaledW) > 1) {
    warn(`scaledW mismatch: host=${scaledW}, expected=${expectedThreeW}. ` +
         `Features may land off-terrain — check that data-map-width matches the map size.`);
  }

  // Group placements by feature name so we can place them in batches the
  // moment each prototype finishes loading.
  const placementsByName = new Map();
  const geovents = [];
  for (const p of sceneData.features) {
    if (GEOVENT_NAMES.has(p.name)) {
      geovents.push(p);
      continue;
    }
    if (!placementsByName.has(p.name)) placementsByName.set(p.name, []);
    placementsByName.get(p.name).push(p);
  }
  const uniqueNames = [...placementsByName.keys()];
  log(`streaming ${uniqueNames.length} unique feature models (${sceneData.features.length} placements)...`);

  // Pre-create the feature group so we can attach instances as they arrive.
  // ctx carries everything springToThree needs: terrain dimensions and the
  // shared heightmap (if the host exposed one). worldW/worldH come from
  // placements.json — they're the Spring "elmo" extents, used to map a
  // feature's (x, z) into heightmap pixel coordinates.
  const ctx = {
    scene, CONFIG, scaledW, scaledH,
    heightmap: host.heightmap || null,
    worldW: sceneData.worldWidth,
    worldH: sceneData.worldHeight,
  };
  if (ctx.heightmap) {
    log(`using shared heightmap (${ctx.heightmap.width}×${ctx.heightmap.height}, ` +
        `range ${ctx.heightmap.minHeight}..${ctx.heightmap.maxHeight})`);
  } else {
    log('no shared heightmap on host — falling back to placements.json y values');
  }
  const group = new THREE.Group();
  group.name = 'bar-features';
  scene.add(group);

  // Geovent smoke is independent of GLB loading — spawn it immediately so
  // the geyser plumes appear right when the map loads.
  let smoke = null;
  if (geovents.length > 0) {
    smoke = buildGeoventSmoke(geovents, ctx);
    if (smoke) scene.add(smoke);
  }

  // Animation loop for geovent smoke. We tick from our own RAF callback so
  // we don't fight with the host's render loop.
  let lastFrame = performance.now();
  if (smoke) {
    const tick = (now) => {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      tickSmoke(smoke, dt);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // Mobile: features are now loaded the same way as desktop (streamed with
  // frame yields). Previously skipped to save bandwidth/GPU, but the
  // two-phase loader is light enough to handle it.

  // Phase 1: download all GLBs in parallel. fetch() is non-blocking so
  // the terrain keeps rendering smoothly while files come in.
  const { buffers, failed } = await downloadAllGLBs(uniqueNames);
  if (failed.length) warn(`${failed.length} models failed to download:`, failed);

  // Phase 2: parse each GLB and place its instances, spreading the work
  // across many frames. Each feature type gets 4 steps with a frame yield
  // between each: (1) parse GLB, (2) load per-map textures, (3) prepare
  // prototype geometry, (4) create InstancedMesh + upload matrices.
  const loader = new GLTFLoader();
  const parseGLB = (buf, url) => new Promise((resolve, reject) => {
    loader.parse(buf, url.substring(0, url.lastIndexOf('/') + 1), resolve, reject);
  });

  // Per-map texture cache: URL → Promise<THREE.Texture>
  const texCache = new Map();
  const texBase = `${CDN_BASE}/maps_features`;
  function loadMapTex(featureGroup, filename, sRGB) {
    const url = `${texBase}/${featureGroup}/${filename}`;
    if (texCache.has(url)) return texCache.get(url);
    const promise = new THREE.TextureLoader().loadAsync(url).then(tex => {
      if (sRGB) tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = IS_MOBILE ? 1 : 8;
      if (IS_MOBILE) {
        tex.generateMipmaps = false;
        tex.minFilter = THREE.LinearFilter;
      }
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.needsUpdate = true;
      return tex;
    }).catch(e => { warn(`tex load failed: ${url}`, e); return null; });
    texCache.set(url, promise);
    return promise;
  }

  // Rewrite a texture filename for the current map.
  // GLB extras store a filename that may contain __<original-slug> from
  // whichever map first built the GLB. Shared textures (normals, rocks30)
  // have no __slug suffix and are used as-is.
  function rewriteTexForMap(filename) {
    if (!filename) return filename;
    const m = filename.match(/^(.+)__[a-z0-9-]+(\.\w+)$/);
    if (!m) return filename;            // shared texture — no slug suffix
    return `${m[1]}__${slug}${m[2]}`;   // replace slug with current map
  }

  // Assign per-map textures to materials based on glTF extras.
  // GLBs are geometry-only; material.userData carries colorTex/normalTex
  // filenames + featureGroup from the builder.
  async function assignMapTextures(scene) {
    const promises = [];
    let meshCount = 0, texCount = 0;
    scene.traverse(o => {
      if (!o.isMesh) return;
      meshCount++;
      const mat = Array.isArray(o.material) ? o.material[0] : o.material;
      if (!mat || !mat.userData) return;
      const { colorTex, normalTex, featureGroup } = mat.userData;
      if (!featureGroup) return;
      texCount++;
      if (colorTex) {
        const fn = rewriteTexForMap(colorTex);
        promises.push(loadMapTex(featureGroup, fn, true).then(tex => {
          if (tex) {
            mat.map = tex;
            // BAR's tree/feature shaders apply PBROVERRIDE (emissiveness=0.2)
            // and brightnessFactor=1.3, making features much brighter than a
            // plain MeshStandardMaterial. Emulate this with emissiveMap + a
            // tinted emissive color so features don't look almost black.
            mat.emissiveMap = tex;
            mat.emissive = new THREE.Color(0.55, 0.55, 0.55);
            mat.needsUpdate = true;
          }
        }));
      }
      if (normalTex) {
        promises.push(loadMapTex(featureGroup, normalTex, false).then(tex => {
          if (tex) { mat.normalMap = tex; mat.needsUpdate = true; }
        }));
      }
    });
    if (promises.length) await Promise.all(promises);
    if (texCount > 0) log(`  textures: ${texCount}/${meshCount} meshes had extras, ${promises.length} loads`);
    else if (meshCount > 0) log(`  textures: 0/${meshCount} meshes had extras (no userData.featureGroup)`);
  }

  log(`parsing & placing ${buffers.size} feature types...`);
  let placedSoFar = 0;
  let parsed = 0;
  for (const [name, buf] of buffers) {
    try {
      const url = `${CDN_BASE}/features/${name}/model.glb`;
      // Step 1: parse GLB → GLTF scene graph
      const gltf = await parseGLB(buf, url);
      await _yieldFrame();
      // Step 2: load per-map textures into parsed materials
      await assignMapTextures(gltf.scene);
      await _yieldFrame();
      // Step 3: prepare prototype (merge pieces, bake transforms)
      ensureScratch();
      const protoGroups = prepareProto(gltf.scene, ctx);
      await _yieldFrame();
      // Step 4: create InstancedMeshes + upload matrices
      if (protoGroups) {
        const placementsForName = placementsByName.get(name);
        const placementMatrices = new Array(placementsForName.length);
        for (let i = 0; i < placementsForName.length; i++) {
          const p = placementsForName[i];
          const { worldX, worldY, worldZ } = springToThree(p.x, p.z, p.y, ctx);
          _tmpPos.set(worldX, worldY, worldZ);
          _tmpQuat.setFromAxisAngle(_yAxis, p.rotY || 0);
          const m = new THREE.Matrix4();
          m.compose(_tmpPos, _tmpQuat, _tmpScale);
          placementMatrices[i] = m;
        }
        for (const grp of protoGroups) {
          const mat = grp.material ? grp.material.clone() : new THREE.MeshStandardMaterial();
          const inst = new THREE.InstancedMesh(grp.geometry, mat, placementsForName.length);
          inst.castShadow = !IS_MOBILE;
          inst.receiveShadow = !IS_MOBILE;
          inst.frustumCulled = false;
          for (let i = 0; i < placementsForName.length; i++) inst.setMatrixAt(i, placementMatrices[i]);
          inst.instanceMatrix.needsUpdate = true;
          inst.instanceMatrix.setUsage(THREE.StaticDrawUsage);
          group.add(inst);
        }
        placedSoFar += placementsForName.length;
      }
    } catch (e) {
      warn(`parse failed: ${name}`, e.message || e);
    }
    parsed++;
    if (parsed === buffers.size || parsed % 5 === 0) {
      log(`  ${parsed}/${buffers.size} types, ${placedSoFar} instances placed`);
    }
    await _yieldFrame();
  }
  log(`done — ${group.children.length} draw calls, ${placedSoFar} instances, ${geovents.length} geovents`);

  window.barFeatures = { group, smoke, sceneData };
}

init().catch((e) => warn('init failed:', e));
})();
</script>
